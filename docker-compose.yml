version: '3.8'\n\nservices:\n  supabase:\n    image: supabase/postgres:latest\n    ports:\n      - "5432:5432"\n    environment:\n      - POSTGRES_PASSWORD=yourpassword\n  postgrest:\n    image: postgrest/postgrest:latest\n    depends_on:\n      - supabase\n    environment:\n      - PGRST_DB_URI=postgres://postgres:yourpassword@supabase:5432/postgres\n      - PGRST_DB_ANON_ROLE=anon\n      - PGRST_DB_CHANNELS=your_channel\n    ports:\n      - "3000:3000"\n  gotrue:\n    image: supabase/gotrue:latest\n    depends_on:\n      - supabase\n    environment:\n      - GOTRUE_DB_DRIVER=postgres\n      - GOTRUE_DB_URL=postgres://postgres:yourpassword@supabase:5432/postgres\n      - GOTRUE_API_HOST=your_api_host\n    ports:\n      - "9999:9999"\n